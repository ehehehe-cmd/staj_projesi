# Sentetik veri üretici konfigürasyonu (TASARIM.md §5, §12.4).
#
# Gerçek fabrika verisi mevcut olmadığı için (referans makalenin "Data
# availability statement"i, bkz. TASARIM.md §0.2) buradaki TÜM sayısal
# aralıklar mühendislik tahminine dayalı YER TUTUCU'dur — Faz 1'in
# constraint_config seed değerleriyle aynı ruhta (bkz. §12.2.3.1).
#
# İki tasarım gereksinimini (TASARIM.md §5) yansıtacak şekilde kalibre
# edildi:
#   1) "Bir kurs tipik olarak 60-100 order içerir, 1-2 ana ürün grubu
#      (K küçük, grup büyüklükleri büyük)" → main_groups_per_course +
#      group_size aralıkları.
#   2) "Geçiş siparişleri azdır, dar bir çelik kalitesi setine sınırlıdır,
#      boyutları geniş varyasyonludur" → transition_steel_grades (2 kalite)
#      + transition_*_mm aralıkları (main_*'tan daha geniş).

main_steel_grades: [Q235B, Q345B, SPHC, SS400, SPCC]
transition_steel_grades: [TR-C, TR-D]

main_groups_per_course: {min: 1, max: 2}
group_size: {min: 30, max: 70}

main_width_mm: {min: 900.0, max: 1200.0}
main_thickness_mm: {min: 1.2, max: 4.0}
main_hardness: {min: 30.0, max: 50.0}
main_heating_temp_c: {min: 820.0, max: 900.0}

# Aynı grup (batch) içindeki order'lar arasında beklenen küçük sapma
# (§1.2: "maintain stable dimensional parameters" — width/thickness grup
# içinde SABİT tutulur, yalnızca hardness/heating_temp'te küçük jitter olur).
within_batch_jitter: {hardness: 1.0, heating_temp_c: 3.0}

# Fiziksel slab boyutları (sürekli döküm slabı — Table 2: Wᵢ, Tᵢ, Lᵢ).
slab_thickness_mm: {min: 200.0, max: 230.0}
slab_length_mm: {min: 6000.0, max: 10000.0}
slab_width_margin_mm: {min: 0.0, max: 40.0}  # slab_width = ürün width + bu marj

transition_width_mm: {min: 700.0, max: 1700.0}
transition_thickness_mm: {min: 1.0, max: 6.5}
transition_hardness: {min: 25.0, max: 75.0}
transition_heating_temp_c: {min: 800.0, max: 960.0}

# Köprü zincirine dahil olmayan, havuzu gerçekçi büyüklükte/çeşitlilikte
# tutan ekstra "dolgu" (decoy) geçiş order'ları — worker'a gerçek bir seçim
# (birden fazla fizibl aday) sunmak için gereklidir.
decoy_transition_count: {min: 4, max: 10}
