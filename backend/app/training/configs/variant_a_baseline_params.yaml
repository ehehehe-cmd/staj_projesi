# VARYANT A — "sadece kod-fix" karşılaştırma konfigürasyonu (2026-08-06).
#
# default.yaml'ın (VARYANT B) birebir kopyasıdır, TEK FARKI:
# target_update_interval=200, learning_rate=0.001 (değişiklik ÖNCESİ,
# orijinal değerler). Amaç: worker/loss stabilizasyonunun ne kadarının
# dqn_agent.py'deki kod değişikliğinden (Huber loss + gradient clipping,
# TASARIM.md §12.5.11), ne kadarının bu iki YAML parametresinden geldiğini
# ayırt edebilmek — ikisi birlikte değişirse hangisinin işe yaradığı
# belirsiz kalır.
#
# Bu dosya EGITIM_REHBERI.md §1'in kendi önerisiyle oluşturuldu: "Farklı
# bir hiperparametre dosyası vermek için ... birden fazla varyant
# deniyorsanız dosyayı KOPYALAYIP değiştirin, orijinali bozmayın."

seed: 7
episodes: 3000

courses_per_episode: 5
k_max: 10
p_max: 70

max_manager_steps_per_course: 20
max_worker_steps_per_subtask: 10

gamma: 0.99
hidden_dim: 128
learning_rate: 0.001          # <- VARYANT A: orijinal değer (B'de 0.0005)
batch_size: 64
target_update_interval: 200   # <- VARYANT A: orijinal değer (B'de 500)
replay_capacity: 50000
min_replay_size: 1000

epsilon_start: 1.0
epsilon_end: 0.05
epsilon_decay_steps: 20000

reward_weights:
  omega1: 1.0
  omega2: 0.2
  r_s: 20.0
  beta0: 2.0
  beta1: 0.5
  beta2: 1.0
  m_target: 100.0
  omega3: 0.1
