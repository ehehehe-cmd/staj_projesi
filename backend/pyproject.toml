[project]
name = "hotrolling-backend"
version = "0.1.0"
description = "Sicak Haddeleme HRL Cizelgeleme Sistemi - backend (API + live engine + offline training)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "pydantic-settings>=2.5",
  "torch>=2.4",
  "numpy>=1.26",
  "gymnasium>=0.29",
  "python-dotenv>=1.0",
  "websockets>=13.0",
  "tensorboard>=2.17",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
