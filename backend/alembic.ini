[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; sqlalchemy.url kasıtlı olarak boş bırakılıyor — gerçek DB URL'i (şifre dahil)
; alembic/env.py içinde app.core.config.settings üzerinden backend/.env'den okunur.
; Bu, DB parolasının alembic.ini'de (git'e girebilecek bir dosyada) düz metin olarak durmasını engeller.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
